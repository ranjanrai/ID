<!DOCTYPE html>
<html>
<head>
  <title>ID Verification – Student Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student ID Verification System</h2>

<input
  type="text"
  id="searchInput"
  placeholder="Search by student name..."
  onkeyup="searchTable()"
>

<div class="table-container">
 <table id="studentTable">
  <thead>
    <tr>
      <th>Photo</th>
      <th>ID Card No</th>
      <th>Name</th>
      <th>Course</th>
      <th>Session</th>
      <th>Father Name</th>
      <th>Mother Name</th>
      <th>Address</th>
      <th>Post Office</th>
      <th>Police Station</th>
      <th>District</th>
      <th>PIN</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
</div>

<script src="student.js"></script>
</body>
</html>
