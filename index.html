<!DOCTYPE html>
<html>
<head>
  <title>ID Verification – Student Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student ID Verification System</h2>

<input
  type="text"
  id="searchInput"
  placeholder="Search by student name..."
  onkeyup="searchTable()"
>

<div class="card-container">

  <div class="student-card">
    <img id="photo" class="big-photo">

  <div class="details">
  <div class="row"><span>ID Card No</span><strong id="id_card_no"></strong></div>
  <div class="row"><span>Name</span><strong id="name"></strong></div>
  <div class="row"><span>Course</span><strong id="course"></strong></div>
  <div class="row"><span>Session</span><strong id="session"></strong></div>

  <hr>

  <div class="row"><span>Father Name</span><strong id="father_name"></strong></div>
  <div class="row"><span>Mother Name</span><strong id="mother_name"></strong></div>

  <hr>

  <div class="row"><span>Address</span><strong id="address"></strong></div>
  <div class="row"><span>Post Office</span><strong id="post_office"></strong></div>
  <div class="row"><span>Police Station</span><strong id="police_station"></strong></div>
  <div class="row"><span>District</span><strong id="district"></strong></div>
    <div class="row"><span>State</span><strong id="state"></strong></div>
  <div class="row"><span>PIN</span><strong id="pin"></strong></div>
</div>
  </div>

  <div class="nav-buttons">
    <button onclick="prevStudent()">⬅ Previous</button>
    <button onclick="nextStudent()">Next ➡</button>
  </div>

</div>

<script src="student.js"></script>
</body>
</html>
